<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Zorpill</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f3f0e5;
      font-family: system-ui, "Segoe UI", Roboto, sans-serif;
      -webkit-user-select: none;
      user-select: none;
    }

    .splash {
      width: 100%;
      height: 100vh;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      padding: 32px;
    }

    .art {
      width: 230px;
      max-width: 70%;
      height: auto;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .wordmark {
      margin: 0;
      font-size: 38px;
      font-weight: 700;
      letter-spacing: -1px;
      color: #333c46;
    }

    .loader {
      position: relative;
      width: 240px;
      max-width: 70%;
      height: 14px;
      border-radius: 999px;
      background: #e6e2d3;
      border: 2px solid #333c46;
      overflow: hidden;
      box-shadow: 0 0 0 4px rgba(139, 163, 101, 0.18);
    }

    .loader-fill {
      position: absolute;
      inset: 0;
      width: 35%;
      border-radius: 999px;
      background: linear-gradient(90deg, #9ab074, #74904f);
      animation: sweep 1.3s ease-in-out infinite;
    }

    @keyframes sweep {
      0% { left: -35%; }
      100% { left: 100%; }
    }

    .status {
      margin: 0;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #6b7280;
    }
  </style>
</head>
